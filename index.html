:8px 4px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.metric,.item{border:1px solid var(--line);border-radius:13px;padding:11px;background:var(--card)}.metric b,.amount b{display:block;font-size:10px;letter-spacing:.2px}.value{font-size:22px;font-weight:950;margin-top:4px}.green{color:var(--green)!important}.red{color:var(--red)!important}.blue{color:var(--blue)!important}.orange{color:var(--orange)!important}.list{display:grid;gap:8px;margin-top:10px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:900}.pill.on{background:#dcf5e5;color:#126332}.pill.off{background:#fde1df;color:#9b2c27}.pill.pending{background:#fff0c9;color:#815700}.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}.amount{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff}.amount strong{font-size:16px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.toolbar button{padding:7px 9px;min-height:34px}.notice{border:1px solid var(--line);border-radius:13px;padding:11px;margin-top:9px;background:#fff}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.err{background:#fdeaea;color:#8e1e1e;padding:11px;border-radius:10px;margin-top:10px}.ok{background:#e9f8ee;color:#176c38;padding:11px;border-radius:10px;margin-top:10px}.bottom{display:none}.sectionTitle{display:flex;justify-content:space-between;align-items:center;gap:8px}.filterRow{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.help{font-size:12px;color:var(--muted);margin-top:5px}.moneyInput{font-variant-numeric:tabular-nums}.variantRow{display:grid;grid-template-columns:1.4fr .8fr auto;gap:7px;align-items:end;margin:7px 0}.variantRow button{min-width:44px}.modalBg{position:fixed;inset:0;background:#0007;z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.modalCard{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 55px #0004}.modalCard h3{margin:0 0 8px;font-size:22px}.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.miniSummary{font-size:13px;padding:9px;border-radius:10px;background:#fff;border:1px solid var(--line);margin-top:7px}
@media(max-width:850px){.nav{grid-template-columns:repeat(5,1fr)}.grid4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){body{padding:0 0 82px}.wrap{max-width:none}.card{margin:8px;border-radius:15px;padding:14px}.top{margin:0;border-radius:0;position:sticky;top:0;z-index:20;border-left:0;border-right:0;border-top:0}.brand{font-size:19px}.seal{width:34px;height:34px}.hero{margin:8px;border-radius:15px;padding:14px}.heroTitle{font-size:26px}.nav{display:none}.grid4,.grid3,.grid2,.amounts,.filterRow{grid-template-columns:repeat(2,1fr)}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);border-top:1px solid var(--line);padding:5px 4px calc(5px + env(safe-area-inset-bottom))}.bottom button{background:transparent;color:var(--text);font-size:11px;padding:4px 2px;min-height:58px}.bottom span{display:block;font-size:21px}.bottom .reg{background:var(--brand);color:white;margin-top:-14px;border-radius:17px;box-shadow:0 5px 16px #0002}.amount strong{font-size:15px}}

let session=JSON.parse(localStorage.getItem('eleva_session')||'null'),taller=null;
function msg(text,type='err'){let el=$('authMsg');el.className=type;el.textContent=text}
function headers(extra={}){return {'apikey':KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json',...extra}}
async function refreshSession(){
  if(!session?.refresh_token) throw new Error('SESSION_EXPIRED');
  let r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});
  let d=await r.json();
  if(!r.ok||!d?.access_token) throw new Error('SESSION_EXPIRED');
  session=d;localStorage.setItem('eleva_session',JSON.stringify(d));return d;
}
function sessionError(data,status){let t=String(data?.message||data?.error_description||data?.error||'').toLowerCase();return status===401||status===403||t.includes('jwt expired')||t.includes('invalid jwt')||t.includes('refresh token')||t.includes('user from sub claim');}
async function request(path,opt={},retried=false){
  let r=await fetch(SB+path,{...opt,headers:{...headers(opt.headers||{})}});let txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null}catch{data=txt}
  if(!r.ok&&sessionError(data,r.status)&&!retried){
    try{await refreshSession();return request(path,opt,true)}catch{localStorage.removeItem('eleva_session');session=null;throw new Error('SESSION_EXPIRED')}
  }
  if(!r.ok)throw new Error(data?.message||data?.error_description||data?.error||txt||('HTTP '+r.status));return data
}
function q(v){return encodeURIComponent(v)}
async function select(table,params=''){return request('/rest/v1/'+table+'?'+params,{headers:{Prefer:'return=representation'}})}
async function insert(table,obj){return request('/rest/v1/'+table,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)})}
async function update(table,id,obj){return request('/rest/v1/'+table+'?id=eq.'+q(id),{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)})}
async function rpc(name,obj={}){return request('/rest/v1/rpc/'+name,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify(obj)})}
function opId(){return (globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{let r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}
function monthBounds(date=today()){let d=new Date(date+'T12:00:00'),y=d.getFullYear(),m=d.getMonth()+1;let ini=`${y}-${String(m).padStart(2,'0')}-01`,n=new Date(y,m,1),fin=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-01`;return {ini,fin}}
function moneyInput(id){let el=$(id);if(!el)return;el.inputMode='decimal';let zero=()=>{let v=String(el.value||'').replace(',','.').trim();return v!==''&&Number(v)===0};el.addEventListener('focus',()=>{if(zero())setTimeout(()=>el.select(),0)});el.addEventListener('pointerup',()=>{if(zero())setTimeout(()=>el.select(),0)});el.addEventListener('input',()=>{let s=el.value.replace(',','.').replace(/[^0-9.]/g,'');let p=s.split('.');if(p.length>2)s=p.shift()+'.'+p.join('');if(s.includes('.')){let[a,b]=s.split('.');s=a+'.'+(b||'').slice(0,2)}el.value=s})}

$('signupBtn').onclick=async()=>{let b=$('signupBtn'),email=$('se').value.trim().toLowerCase(),pass=$('sp').value;if(!email||!email.includes('@'))return msg('Escribe un email válido');if(pass.length<8)return msg('La contraseña debe tener mínimo 8 caracteres');if(pass!==$('sp2').value)return msg('Las contraseñas no coinciden');disable(b,true);try{let r=await fetch(SB+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pass})});let d=await r.json();if(!r.ok)throw new Error(d.msg||d.error_description||'No se pudo crear la cuenta');if(d.access_token){session=d;localStorage.setItem('eleva_session',JSON.stringify(d));await boot();return}msg('Cuenta creada. Revisa tu email y confirma tu cuenta antes de entrar.','ok');$('signupBox').classList.add('hidden');$('loginBox').classList.remove('hidden');$('le').value=email}catch(e){msg(e.message)}finally{disable(b,false)}};

async function boot(){if(!session?.access_token)return;try{let users=await request('/auth/v1/user');if(!users?.id)throw new Error('SESSION_EXPIRED');let data=await select('talleres','select=*&propietario_user_id=eq.'+q(users.id)+'&limit=1');$('auth').classList.add('hidden');$('createTaller').classList.add('hidden');$('app').classList.add('hidden');if(!data.length){$('createTaller').classList.remove('hidden');return}taller=data[0];showApp()}catch(e){localStorage.removeItem('eleva_session');session=null;taller=null;$('app').classList.add('hidden');$('createTaller').classList.add('hidden');$('auth').classList.remove('hidden');msg('Tu sesión venció. Ingresa nuevamente para continuar.','err') }}

async function dashboard(force){let [p,w,c,m]=await Promise.all([qs('proveedores_servicio','id'),qs('funcionarios','id,activo'),qs('servicios','id,valor_total,valor_neto,descuento_defectos,valor_cobrado,estado'),qs('movimientos','tipo,valor,fecha,estado')]);m=m.filter(x=>x.estado!=='anulado');let mm=m.filter(x=>String(x.fecha).startsWith(ym())),inn=mm.filter(x=>x.tipo==='entrada').reduce((a,x)=>a+Number(x.valor),0),out=mm.filter(x=>x.tipo==='salida').reduce((a,x)=>a+Number(x.valor),0),rec=c.reduce((a,x)=>a+Math.max(0,Number(x.valor_neto??x.valor_total??0)-Number(x.valor_cobrado||0)),0),pending=c.filter(x=>Number(x.valor_neto??x.valor_total??0)>Number(x.valor_cobrado||0)).length;if(!force&&!p.length&&!w.length&&!c.length&&!m.length){$('content').innerHTML=`<div class="card" style="text-align:center;padding:26px 18px"><div style="font-size:1.35rem;font-weight:800;margin-bottom:6px">¡Tu taller está listo! 👋</div><p style="color:var(--muted);margin:6px 0 2px">Vamos a comenzar con algo que ya ocurre todos los días en tu negocio.</p><p style="font-weight:700;margin:14px 0 16px">¿Quién te entrega los cortes?</p><button class="primary full" onclick="openM('providers')">Registrar mi primer proveedor</button><div style="color:var(--muted);font-size:.85rem;margin-top:8px">Te llevará menos de 2 minutos.</div><button class="soft" style="margin-top:16px" onclick="dashboard(true)">Prefiero explorar por mi cuenta</button></div>`;return}$('content').innerHTML=`<div class="card"><h2>Así está mi taller</h2><div class="grid4"><div class="metric"><b>ENTRÓ ESTE MES</b><div class="value green">${brl(inn)}</div></div><div class="metric"><b>SALIÓ ESTE MES</b><div class="value red">${brl(out)}</div></div><div class="metric"><b>RESULTADO</b><div class="value ${inn-out>=0?'green':'red'}">${brl(inn-out)}</div></div><div class="metric"><b>POR COBRAR</b><div class="value orange">${brl(rec)}</div></div></div><div class="notice"><b>🔔 Recados importantes</b><span>${pending?pending+' corte(s) pendien alert('El valor supera el saldo pendiente. Para una corrección usa un ajuste controlado.');disable(b,true);try{await rpc('registrar_cobro_seguro',{p_taller_id:taller.id,p_servicio_id:id,p_operacion_id:opId(),p_valor:v,p_medio_pago:$('cmed').value,p_tipo:$('ctyp').value,p_observacion:null});collections()}catch(e){alert(e.message)}finally{disable(b,false)}}}
async function payments(){let{ini,fin}=monthBounds();let[w,pr,pa,ad]=await Promise.all([qs('funcionarios','*','activo=eq.true&order=nombre.asc&limit=50'),qs('produccion','*',`fecha=gte.${ini}&fecha=lt.${fin}&estado=neq.anulado`),qs('pagos_funcionarios','*',`competencia_mes=gte.${ini}&competencia_mes=lt.${fin}`),qs('adelantos','*',`fecha=gte.${ini}&fecha=lt.${fin}`)]);$('content').innerHTML=`<div class="card"><h2>💵 Pagos a funcionarios</h2><label>Buscar funcionario</label><input id="pwsearch" placeholder="Escribe el nombre"><div class="help">Mostramos hasta 50 coincidencias para mantener el sistema rápido.</div><label>Funcionario</label><select id="pwf">${w.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join('')}</select><div id="payInfo"></div><label>Valor</label><input id="pval" class="moneyInput"><label>Tipo</label><select id="pt"><option value="pago">Pago</option><option value="adelanto">Adelanto</option></select><label>Medio</label><select id="pmed"><option value="pix_banco">PIX / Transferencia</option><option value="efectivo">Efectivo</option></select><button id="psave" class="primary full">Guardar</button></div>`;moneyInput('pval');let timer=null;async function loadWorkers(term=''){let params='activo=eq.true&order=nombre.asc&limit=50';if(term.trim())params+='&nombre=ilike.'+q('*'+term.trim()+'*');w=await qs('funcionarios','*',params);$('pwf').innerHTML=w.map(x=>`<option value="${x.id}">${esc(x.nombre)}</option>`).join('');info()}$('pwsearch').oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>loadWorkers($('pwsearch').value).catch(e=>alert(e.message)),250)};function calc(id){let x=w.find(z=>z.id===id);if(!x)return{generated:0,paid:0,adv:0,due:0};let generated=x.tipo_pago==='fijo'?Number(x.salario_fijo||0):pr.filter(z=>z.funcionario_id===id).reduce((a,z)=>a+Number(z.total_generado||0),0),paid=pa.filter(z=>z.funcionario_id===id).reduce((a,z)=>a+Number(z.valor),0),adv=ad.filter(z=>z.funcionario_id===id).reduce((a,z)=>a+Number(z.valor),0);return{generated,paid,adv,due:Math.max(0,generated-paid-adv)}}function info(){let id=$('pwf').value,z=calc(id);$('payInfo').innerHTML=id?`<div class="amounts"><div class="amount"><b>GENERADO</b><strong class="blue">${brl(z.generated)}</strong></div><div class="amount"><b>ADELANTO</b><strong class="orange">${brl(z.adv)}</strong></div><div class="amount"><b>PAGADO</b><strong class="green">${brl(z.paid)}</strong></div><div class="amount"><b>FALTA</b><strong class="${z.due?'red':'green'}">${brl(z.due)}</strong></div></div>`:'<div class="notice">Busca y selecciona un funcionario.</div>'}$('pwf').onchange=info;info();$('psave').onclick=async()=>{let b=$('psave'),id=$('pwf').value,v=num('pval'),typ=$('pt').value;if(!id)return alert('Selecciona un funcionario.');if(v<=0)return alert('Ingresa un valor mayor que cero.');disable(b,true);try{await rpc('registrar_pago_funcionario_seguro',{p_taller_id:taller.id,p_funcionario_id:id,p_operacion_id:opId(),p_valor:v,p_tipo:typ,p_medio_pago:$('pmed').value,p_competencia_mes:ym()+'-01',p_observacion:null});payments()}catch(e){alert(e.message)}finally{disable(b,false)}}}
async function expenses(){let m=await qs('movimientos','*','tipo=eq.salida&estado=neq.anulado&order=fecha.desc');$('content').innerHTML=`<div class="card"><h2>🧾 Gastos</h2><div class="grid2"><div><label>Categoría</label><select id="ec"><option>Alquiler</option><option>Luz</option><option>Agua</option><option>Hilos</option><option>Mantenimiento</option><option>Máquinas</option><option>Transporte</option><option>Otros</option></select></div><div><label>Fecha</label><input id="efd" type="date" value="${today()}"></div></div><label>Nombre / descripción</label><input id="ed"><label>Valor</label><input id="ev" class="moneyInput"><label>Medio</label><select id="emed"><option value="pix_banco">PIX</option><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option></select><button id="es" class="primary full">Guardar gasto</button><h3>Extracto de gastos</h3><div class="filterRow"><input id="gfdate" type="date"><select id="gfmed"><option value="">Todos los medios</option><option value="pix_banco">PIX</option><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option></select></div><div id="glist" class="list"></div></div>`;moneyInput('ev');function render(){let f=m.filter(x=>(!$('gfdate').value||x.fecha===$('gfdate').value)&&(!$('gfmed').value||x.medio_pago===$('gfmed').value));$('glist').innerHTML=f.length?f.map(x=>`<div class="item"><b class="red">-${brl(x.valor)}</b> ${esc(x.categoria)}<div class="muted">${x.fecha} · ${esc(x.descripcion||'')} · ${esc(x.medio_pago||'')}</div></div>`).join(''):'<div class="empty">Sin resultados.</div>'}$('gfdate').onchange=render;$('gfmed').onchange=render;render();$('es').onclick=async()=>{let b=$('es'),v=num('ev'),cat=$('ec').value,desc=$('ed').value.trim();if(v<=0)return alert('Ingresa un valor mayor que cero.');if(cat==='Otros'&&!desc)return alert('En Otros, escribe el nombre del gasto.');disable(b,true);try{await insert('movimientos',{taller_id:taller.id,fecha:$('efd').value||today(),tipo:'salida',categoria:cat,descripcion:desc||null,valor:v,medio_pago:$('emed').value});expenses()}catch(e){alert(e.message)}finally{disable(b,false)}}}
async function movements(){let m=await qs('movimientos','*','estado=neq.anulado&order=fecha.desc,created_at.desc');$('content').innerHTML=`<div class="card"><h2>📋 Mi Extracto</h2><div class="filterRow"><input id="mfdate" type="date"><select id="mftype"><option value="">Entradas y salidas</option><option value="entrada">Entradas</option><option value="salida">Salidas</option></select><select id="mfmed"><option value="">Todos los medios</option><option value="pix_banco">PIX</option><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option></select></div><div id="mlist" class="list"></div></div>`;function render(){let f=m.filter(x=>(!$('mfdate').value||x.fecha===$('mfdate').value)&&(!$('mftype').value||x.tipo===$('mftype').value)&&(!$('mfmed').value||x.medio_pago===$('mfmed').value));$('mlist').innerHTML=f.length?f.map(x=>`<div class="item"><b class="${x.tipo==='entrada'?'green':'red'}">${x.tipo==='entrada'?'+':'-'}${brl(x.valor)}</b> ${esc(x.categoria)}<div class="muted">${x.fecha} · ${esc(x.descripcion||'')} · ${esc(x.medio_pago||'')}</div></div>`).join(''):'<div class="empty">Aún no hay movimientos.</div>'}['mfdate','mftype','mfmed'].forEach(id=>$(id).onchange=render);render()}
async function month(){let z=await rpc('resumen_mes',{p_taller_id:taller.id,p_mes:ym()+'-01'});$('content').innerHTML=`<div class="card"><h2>🗓️ Mi Mes</h2><div class="grid4"><div class="metric"><b>ENTRÓ</b><div class="value green">${brl(z.entrada)}</div></div><div class="metric"><b>SALIÓ</b><div class="value red">${brl(z.salida)}</div></div><div class="metric"><b>POR RECIBIR DEL MES</b><div class="value orange">${brl(z.por_cobrar_mes)}</div></div><div class="metric"><b>FALTA PAGAR</b><div class="value red">${brl(z.falta_pagar)}</div></div></div><div class="notice"><b>Resultado de caja del mes:</b> <span class="${Number(z.resultado)>=0?'green':'red'}">${brl(z.resultado)}</span><br><span class="muted">Por cobrar total acumulado: ${brl(z.por_cobrar_total)}</span></div></div>`}
async function year(){let years=await rpc('anios_disponibles',{p_taller_id:taller.id});if(!Array.isArray(years)||!years.length)years=[Number(today().slice(0,4))];let meses=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'],parts=[];for(let y of years){let z=await rpc('resumen_anual',{p_taller_id:taller.id,p_anio:Number(y)}),datos=(z.meses||[]).map((x,idx)=>({nom:meses[idx],i:Number(x.entrada||0),o:Number(x.salida||0),s:Number(x.resultado||0)})),ti=Number(z.entrada||0),to=Number(z.salida||0),ts=Number(z.resultado||0),max=Math.max(1,...datos.flatMap(x=>[x.i,x.o,Math.abs(x.s)]));let barras=datos.map(x=>`<div style="min-width:72px;text-align:center"><div style="height:150px;display:flex;align-items:flex-end;justify-content:center;gap:4px;border-bottom:1px solid #ddd"><div title="Entrada ${brl(x.i)}" style="width:16px;height:${Math.round((x.i/max)*135)}px;background:#22a06b;border-radius:5px 5px 0 0"></div><div title="Salida ${brl(x.o)}" style="width:16px;height:${Math.round((x.o/max)*135)}px;background:#d64545;border-radius:5px 5px 0 0"></div><div title="Saldo ${brl(x.s)}" style="width:16px;height:${Math.round((Math.abs(x.s)/max)*135)}px;background:#2f80ed;border-radius:5px 5px 0 0;opacity:${x.s===0?.25:1}"></div></div><small>${x.nom}</small><div style="font-size:10px;margin-top:4px"><span class="green">${brl(x.i)}</span><br><span class="red">${brl(x.o)}</span><br><span class="${x.s>=0?'green':'red'}">${brl(x.s)}</span></div></div>`).join('');parts.push(`<div class="item"><h3>${y}</h3><div class="amounts"><div class="amount"><b>ENTRADAS DEL AÑO</b><strong class="green">${brl(ti)}</strong></div><div class="amount"><b>SALIDAS DEL AÑO</b><strong class="red">${brl(to)}</strong></div><div class="amount"><b>SALDO DEL AÑO</b><strong class="${ts>=0?'green':'red'}">${brl(ts)}</strong></div></div><div style="margin:16px 0 8px;font-size:12px"><b>Leyenda:</b> <span class="green">■ Entrada</span> &nbsp; <span class="red">■ Salida</span> &nbsp; <span style="color:#2f80ed">■ Saldo</span></div><div style="overflow-x:auto;padding-bottom:8px"><div style="display:flex;gap:10px;min-width:920px;align-items:flex-end">${barras}</div></div></div>`)}$('content').innerHTML=`<div class="card"><h2>📊 Mi Año</h2>${parts.join('')}</div>`}
$('regBtn').onclick=()=>{$('content').innerHTML=`<div class="card"><h2>＋ Registrar</h2><div class="grid2"><button class="soft" onclick="openM('cuts')">✂️ Nuevo corte</button><button class="soft" onclick="openM('production')">🧵 Producción</button><button class="soft" onclick="openM('collections')">💰 Cobro</button><button class="soft" onclick="openM('payments')">💵 Pago funcionario</button><button class="soft" onclick="openM('expenses')">🧾 Gasto</button></div></div>`};
async function editTaller(){$('content').innerHTML=`<div class="card"><h2>⚙️ Editar mi taller</h2><label>Nombre del taller</label><input id="etn" value="${escAttr(taller.nombre_mostrar||taller.nombre||'')}"><label>Tu nombre</label><input id="eto" value="${escAttr(taller.nombre_dueno||'')}"><label>Ciudad</label><input id="etc" value="${escAttr(taller.ciudad||'')}"><label>Teléfono (opcional)</label><input id="ett" value="${escAttr(taller.telefono||'')}"><button id="ets" class="primary full">Guardar cambios</button><div class="help">Cambiar el nombre no elimina ni altera tu historial.</div></div>`;$('ets').onclick=async()=>{let b=$('ets'),n=$('etn').value.trim();if(!n)return alert('El nombre del taller es obligatorio.');disable(b,true);try{let r=await update('talleres',taller.id,{nombre:n,nombre_mostrar:n,nombre_dueno:$('eto').value.trim()||null,ciudad:$('etc').value.trim()||null,telefono:$('ett').value.trim()||null});if(r&&r[0])taller=r[0];$('tallerTitle').textContent=taller.nombre_mostrar||taller.nombre;editTaller()}catch(e){alert(e.message)}finally{disable(b,false)}}}
async function accountSecurity(){$('content').innerHTML=`<div class="card"><h2>🔐 Cuenta y seguridad</h2><div class="notice"><b>Email</b><span>${esc(session?.user?.email||'Cuenta ELEVA')}</span></div><button id="sendReset" class="soft full">Cambiar / recuperar contraseña por email</button><button id="deleteAccount" class="danger full">Eliminar mi cuenta y mis datos</button><div class="help">La eliminación es permanente y elimina el taller y sus datos asociados.</div></div>`;$('sendReset').onclick=async()=>{let email=session?.user?.email;if(!email)return alert('No pude identificar el email.');let r=await fetch(SB+'/auth/v1/recover',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email})});if(!r.ok)return alert('No pude enviar el correo.');alert('Correo de recuperación enviado.')} ;$('deleteAccount').onclick=async()=>{let ok=await friendlyModal({title:'Eliminar cuenta',body:'Esto eliminará permanentemente tu cuenta, tu taller y todos los datos asociados. Esta acción no se puede deshacer.',okText:'Sí, eliminar definitivamente',cancelText:'Cancelar'});if(!ok)return;let typed=prompt('Para confirmar, escribe ELIMINAR');if(typed!=='ELIMINAR')return alert('Eliminación cancelada.');let r=await fetch(SB+'/functions/v1/eleva-delete-account',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:'{}'});let d=await r.json().catch(()=>({}));if(!r.ok)return alert(d.error||'No se pudo eliminar la cuenta.');localStorage.removeItem('eleva_session');alert('Cuenta y datos eliminados.');location.reload()}};
$('moreBtn').onclick=()=>{$('content').innerHTML=`<div class="card"><h2>☰ Más</h2><div class="grid2"><button class="soft" onclick="editTaller()">⚙️ Editar mi taller</button><button class="soft" onclick="accountSecurity()">🔐 Cuenta y seguridad</button><button class="soft" onclick="openM('cuts')">✂️ Cortes</button><button class="soft" onclick="openM('production')">🧵 Producción</button><button class="soft" onclick="openM('collections')">💰 Cobros</button><button class="soft" onclick="openM('payments')">💵 Pagos</button><button class="soft" onclick="openM('expenses')">🧾 Gastos</button><button class="soft" onclick="openM('movements')">📋 Extracto</button><button class="soft" onclick="openM('month')">🗓️ Mi Mes</button><button class="soft" onclick="openM('year')">📊 Mi Año</button></div></div>`};
function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function escAttr(s){return esc(s).replace(/'/g,'&#39;')}
boot();
